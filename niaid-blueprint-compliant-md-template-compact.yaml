type: template
name: "NIAID Blueprint Compliant Schema 0.7.0"
description: "Schema compliant with the NIAID Blueprint for FAIR metadata. This version provides more specific and correct profiles for many fields."
children:
  - key: "type"
    type: controlled-term-field
    name: "type"
    description: "Content type of the digital object being described (e.g., dataset, software application, image; a type of schema.org CreativeWork)"
    prefLabel: "Digital Object Type"
    datatype: iri
    default:
      value: "https://schema.org/Dataset"
      label: "Dataset"
    values:
      - type: branch
        sourceAcronym: "SCHEMA"
        sourceName: "Schema.org core and all extension vocabularies (SCHEMA)"
        termBaseIri: "https://schema.org/CreativeWork"
        termBaseLabel: "CreativeWork"
        termMaxDepth: 0
    actions:
      - action: delete
        termIri: "http://purl.org/dc/dcmitype/Dataset"
        sourceIri: "http://schema.org/CreativeWork"
        sourceAcronym: "SCHEMA"
        type: class
      - action: delete
        termIri: "http://rdfs.org/ns/void#Dataset"
        sourceIri: "http://schema.org/CreativeWork"
        sourceAcronym: "SCHEMA"
        type: class
      - action: move
        to: 0
        termIri: "https://schema.org/Dataset"
        sourceIri: "https://schema.org/CreativeWork"
        sourceAcronym: "SCHEMA"
        type: class
  - key: "identifier"
    type: link-field
    name: "identifier"
    description: "A globally unique, persistent, machine resolvable identifier (GUPRI) assigned to the digital object."
    prefLabel: "Identifier"
  - key: "name"
    type: text-field
    name: "name"
    description: "Descriptive title or name of the digital object."
    prefLabel: "Name"
  - key: "description"
    type: text-area-field
    name: "description"
    description: "A description of the digital object."
    prefLabel: "Description"
  - key: "dateCreated"
    type: temporal-field
    name: "dateCreated"
    description: "The date on which the digital object was created, or if that is not known, date the item was added to a data repository."
    prefLabel: "Date Created/Added"
    datatype: xsd:date
    granularity: day
  - key: "Author(s)"
    type: element
    name: "Author(s)"
    description: "Person(s) and/or organization(s) responsible for the creation of the digital object. Both users and organizations may be independently specified, each as often as appropriate."
    prefLabel: "Author(s)"
    children:
      - key: "accountablePerson"
        type: ext-orcid-field
        name: "accountablePerson"
        description: "A person responsible for the creation of the digital object, identified by the person's ORCID ID. (Both users and organizations may be specified independently, each as often as appropriate.)"
        prefLabel: "Author (Human)"
        configuration:
          multiple: true
          minItems: 1
      - key: "sourceOrganization"
        type: ext-ror-field
        name: "sourceOrganization"
        description: "An organization responsible for the creation of the digital object, identified by the organization's Research Organization Resource Identifier. This specifies an organization as a direct source (not \"the organization of the author\" per se). (Both users and organizations may be specified as sources, each as often as appropriate.)"
        prefLabel: "Organizational Author"
        configuration:
          multiple: true
          minItems: 1
    configuration:
      overrideLabel: "author"
  - key: "funder"
    type: ext-ror-field
    name: "funder"
    description: "Organization(s) providing funding for the digital object, expressed as Research Organization Resource(s) (RORs)."
    prefLabel: "Funder(s)"
    configuration:
      multiple: true
      minItems: 1
  - key: "funding"
    type: text-field
    name: "funding"
    description: "Grant or contract number(s) or other identifier(s) associated with funding the digital object."
    prefLabel: "Grant(s)"
    configuration:
      multiple: true
      minItems: 1
  - key: "measurementTechnique"
    type: controlled-term-field
    name: "measurementTechnique"
    description: "Technique(s) or technologies used to make measurements in the digital object. Selected from NCIT concepts under Method, Laboratory Procedure, and Disease Screening."
    prefLabel: "Measurement Technique(s)"
    datatype: iri
    values:
      - type: branch
        sourceAcronym: "NCIT"
        sourceName: "National Cancer Institute Thesaurus (NCIT)"
        termBaseIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C71460"
        termBaseLabel: "Method"
        termMaxDepth: 0
      - type: branch
        sourceAcronym: "NCIT"
        sourceName: "National Cancer Institute Thesaurus (NCIT)"
        termBaseIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C25294"
        termBaseLabel: "Laboratory Procedure"
        termMaxDepth: 0
      - type: branch
        sourceAcronym: "NCIT"
        sourceName: "undefined (NCIT)"
        termBaseIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C15419"
        termBaseLabel: "Disease Screening"
        termMaxDepth: 0
    configuration:
      multiple: true
      minItems: 1
  - key: "distribution"
    type: link-field
    name: "distribution"
    description: "Link(s) to a downloadable distribution of the digital object. Provide links that resolve to the host page for the bit stream, file, or collection of the digital object; if there is no host page, provide the direct link to download the digital object."
    prefLabel: "Distribution Link(s)"
    configuration:
      multiple: true
      minItems: 1
  - key: "citation"
    type: link-field
    name: "citation"
    description: "Link(s) to citations or references to another creative work related to the digital object. This can include a publication that describes the digital object, a publication that makes use of the digital object, or a collection that includes the digital object."
    prefLabel: "Citation(s)"
    configuration:
      multiple: true
      minItems: 1
  - key: "infectiousAgent"
    type: controlled-term-field
    name: "infectiousAgent"
    description: "Infectious agent(s) involved in the digital object."
    prefLabel: "Infectious Agent(s)"
    datatype: iri
    values:
      - type: ontology
        sourceAcronym: "NCBITAXON"
        sourceName: "National Center for Biotechnology Information (NCBI) Organismal Classification"
    configuration:
      multiple: true
      minItems: 1
  - key: "host"
    type: controlled-term-field
    name: "host"
    description: "Host organism(s) associated with the digital object."
    prefLabel: "Host(s)"
    datatype: iri
    values:
      - type: ontology
        sourceAcronym: "NCBITAXON"
        sourceName: "National Center for Biotechnology Information (NCBI) Organismal Classification"
    configuration:
      overrideLabel: "taxonomicRange"
      multiple: true
      minItems: 1
  - key: "healthCondition"
    type: controlled-term-field
    name: "healthCondition"
    description: "Health condition(s) referenced in the digital object. Selected from MONDO's disease susceptibility, injury, and human disease branches."
    prefLabel: "Health Condition(s)"
    datatype: iri
    values:
      - type: branch
        sourceAcronym: "MONDO"
        sourceName: "Mondo Disease Ontology (MONDO)"
        termBaseIri: "http://purl.obolibrary.org/obo/MONDO_0042489"
        termBaseLabel: "disease susceptibility"
        termMaxDepth: 0
      - type: branch
        sourceAcronym: "MONDO"
        sourceName: "Mondo Disease Ontology (MONDO)"
        termBaseIri: "http://purl.obolibrary.org/obo/MONDO_0021178"
        termBaseLabel: "injury"
        termMaxDepth: 0
      - type: branch
        sourceAcronym: "MONDO"
        sourceName: "Mondo Disease Ontology (MONDO)"
        termBaseIri: "http://purl.obolibrary.org/obo/MONDO_0700096"
        termBaseLabel: "human disease"
        termMaxDepth: 0
    configuration:
      multiple: true
      minItems: 1
  - key: "conditionsOfAccess"
    type: text-area-field
    name: "conditionsOfAccess"
    description: "The condition(s) under which the digital object can be accessed, including data use agreements or limitations. May be specified as one or more IRIs linking to the conditions of access. (Broad categories of access are expressed by the vocabularies COAR (https://vocabularies.coar-repositories.org/access_rights/) and EuroVoc's Access RIght concept (https://op.europa.eu/en/web/eu-vocabularies/concept-scheme/-/resource?uri=http://publications.europa.eu/resource/authority/access-right).)"
    prefLabel: "Conditions of Access"
    configuration:
      multiple: true
      minItems: 1
  - key: "License(s)"
    type: element
    name: "License(s)"
    description: "License(s) under which the digital object is distributed. Licenses can be specified as SPDX identifiers ('Selection'), other 'Generic' IRIs identifying/pointing to licenses, or free text description ('Terms')."
    prefLabel: "License(s)"
    children:
      - key: "licenseIdentifierSelection"
        type: controlled-term-field
        name: "licenseIdentifierSelection"
        description: "License(s) under which the digital object is distributed, specified as a selection from SPDX vocabulary."
        prefLabel: "License Identifier Selection"
        datatype: iri
        values:
          - type: branch
            sourceAcronym: "FDC-GDMT"
            sourceName: "undefined (FDC-GDMT)"
            termBaseIri: "http://vocab.fairdatacollective.org/gdmt/LicenseIdentifier"
            termBaseLabel: "License Identifier"
            termMaxDepth: 0
        configuration:
          overrideLabel: "termCode"
      - key: "licenseIdentifierIri"
        type: link-field
        name: "licenseIdentifierIri"
        description: "License specified as a generic (non-SPDX) identifier in IRI format"
        prefLabel: "License Identifier (Generic IRI)"
        configuration:
          overrideLabel: "identifier"
      - key: "licenseTerms"
        type: text-field
        name: "licenseTerms"
        description: "Text characterizing the licensing terms that apply to the digital object."
        prefLabel: "License Terms Description"
        configuration:
          overrideLabel: "termsOfService"
    configuration:
      overrideLabel: "license"
      multiple: true
      minItems: 1
  - key: "Spatial Coverage"
    type: element
    name: "Spatial Coverage"
    description: "The geographic area covered by the digital object. Each set of 4 fields describes one geospatial location. The total area covered is the union of all the sets."
    prefLabel: "Spatial Coverage"
    children:
      - key: "addressCountry"
        type: controlled-term-field
        name: "addressCountry"
        description: "Identifier for a country representing geospatial coverage of the digital object."
        prefLabel: "Country Identifier"
        datatype: iri
        values:
          - type: branch
            sourceAcronym: "NCIT"
            sourceName: "National Cancer Institute Thesaurus (NCIT)"
            termBaseIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C25464"
            termBaseLabel: "Country"
            termMaxDepth: 0
        configuration:
          multiple: true
          minItems: 1
      - key: "containedInPlace"
        type: controlled-term-field
        name: "containedInPlace"
        description: "An identifier for a geospatial region, such as a city, county, or geospatial feature. Identifiers are taken from the GAZ gazetteer."
        prefLabel: "Geo Place ID"
        datatype: iri
        values:
          - type: ontology
            sourceAcronym: "GAZ"
            sourceName: "Gazetteer"
        configuration:
          multiple: true
          minItems: 1
      - key: "geo"
        type: text-field
        name: "geo"
        description: "A set of longitude and latitude coordinates in decimal degrees representing a geographic coverage. Negative values correspond to western longitude and southern latitudes. More than one pair of points within an entry represents a shape (2 points a line, 3 points a triangle, and so on), with points forming a clockwise closed contained with contents on the right side. Multiple points or shapes are represented by multiple entries."
        prefLabel: "Geospatial Region Coordinates"
        configuration:
          multiple: true
          minItems: 1
      - key: "applicableLocation"
        type: text-field
        name: "applicableLocation"
        description: "A representation of spatial coverage using shapes or  geometries, such as polygons or regions, using the Well-Known Text (WKT) specification (https://docs.ogc.org/is/12-063r5/12-063r5.html#30). Each entry represents a separate WKT-defined geographic area. (3-dimensional areas may also be specified; see the specification.)"
        prefLabel: "GeoShape (WKT)"
        configuration:
          multiple: true
          minItems: 1
    configuration:
      overrideLabel: "spatialCoverage"
      multiple: true
      minItems: 1
  - key: "Temporal Coverage"
    type: element
    name: "Temporal Coverage"
    description: "Period of time represented by a digital object. Multiple intervals may be specified. User may enter any or all of the 4 fields for each interval, depending on the relevance of each field."
    prefLabel: "Temporal Coverage"
    children:
      - key: "startDate"
        type: temporal-field
        name: "startDate"
        description: "Earliest date applicable for this digital object"
        prefLabel: "Start Date"
        datatype: xsd:date
        granularity: day
      - key: "startTime"
        type: temporal-field
        name: "startTime"
        description: "Earliest time applicable for this digital object"
        prefLabel: "Start Time"
        datatype: xsd:time
        granularity: second
        inputTimeFormat: 12h
        inputTimeZone: true
      - key: "endDate"
        type: temporal-field
        name: "endDate"
        description: "Latest date applicable for this digital object"
        prefLabel: "End Date"
        datatype: xsd:date
        granularity: day
      - key: "endTime"
        type: temporal-field
        name: "endTime"
        description: "Latest time applicable for this digital object"
        prefLabel: "End Time"
        datatype: xsd:time
        granularity: second
        inputTimeFormat: 12h
        inputTimeZone: true
    configuration:
      overrideLabel: "temporalCoverage"
      multiple: true
      minItems: 1
